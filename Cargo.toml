[workspace]
members = ["services/*"]

[package]
name = "waybracelet"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
smol = "2.0.2"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
  "wayland",
  "thread-pool",
  "wgpu",
  "smol",
  "canvas",
  "image",
  "advanced",
  "lazy",
  "svg",
] }
iced_exwlshell = { git = "https://github.com/waycrate/exwlshelleventloop.git" }
iced_wayland_subscriber = { git = "https://github.com/waycrate/exwlshelleventloop.git" }
system_shutdown = "4.1.0"
imap = { path = "services/imap" }
wb-dbus = { path = "services/dbus" }
lucide-icons = { version = "1.28.0", features = ["iced"] }
meval = "0.2.0"
freedesktop-desktop-entry = "0.8.1"
strsim = "0.11.1"
freedesktop-icons = "0.4.0"
sled = "0.34.7"
dirs = "6.0.0"
mothscheme = { git = "https://codeberg.org/dcxo/mothscheme", features = ["iced"] }
smol = { workspace = true }
signalfut = "0.1.1"
bitflags = "2.13.1"
chrono = "0.4.45"
